name: Deploy Noctua application

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
      - name: Deploy CloudFormation stack
        env:
          STACK_NAME: ${{ secrets.STACK_NAME }}
        run: |
          # Update these parameter overrides to match your configuration or use SSM parameters/secrets management
          aws cloudformation deploy \
            --template-file files/application.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_IAM \
            --parameter-overrides \
              InstanceProfileName=${{ secrets.INSTANCE_PROFILE }} \
              FrontendIngressCidr=${{ secrets.FRONTEND_INGRESS_CIDR }} \
              FrontendInstanceType=${{ secrets.FRONTEND_INSTANCE_TYPE }} \
              BackendInstanceType=${{ secrets.BACKEND_INSTANCE_TYPE }} \
              DatabaseInstanceType=${{ secrets.DATABASE_INSTANCE_TYPE }}
