services:
  n8n:
    build: .
    container_name: noctua-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto,zlib
    volumes:
      - n8n_data:/home/node/.n8n
      - ./files:/files
      - ./scripts:/files/scripts:ro
      # Map the repository's database folder into the container so /files/database is available.
      # The previous default (../noctua-backend/database) may not exist and would hide ./files/database.
      - ./files/database:/files/database:ro
    restart: unless-stopped

volumes:
  n8n_data:
    name: noctua-n8n-data
